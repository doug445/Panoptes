# Panoptes — MAC randomization
# https://github.com/doug445/Panoptes
#
# Randomizes the Wi-Fi MAC address so an access point cannot use it to
# recognize this machine across visits.
#
#   scan-rand-mac-address  a fresh MAC for every scan, before associating
#   cloned-mac-address     a fresh MAC for every connection
#
# Per-connection settings override this. To pin one network to the real MAC
# (captive portals, MAC-allowlisted networks):
#   nmcli con mod <NAME> 802-11-wireless.cloned-mac-address permanent
#
# 'netcheck' reports the state of this. 'wifi-recover.sh' undoes it.

[device]
wifi.scan-rand-mac-address=yes

[connection]
wifi.cloned-mac-address=random
