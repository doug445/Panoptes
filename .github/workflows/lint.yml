name: lint

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Note on the file-selection loops below: they are written as explicit if/then
# accumulators rather than `grep -q X && printf ...`, because the latter makes
# the command substitution inherit the exit status of the LAST iteration. With
# `bash -e` that fails the whole step whenever the alphabetically-last file in
# bin/ is not of the type being selected.

jobs:
  shellcheck:
    name: shellcheck (bash tools)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Syntax check
        run: |
          for f in bin/* install.sh uninstall.sh; do
            [ -f "$f" ] || continue
            if head -1 "$f" | grep -q bash; then bash -n "$f"; fi
          done

      - name: ShellCheck (warnings are fatal)
        run: |
          files=""
          for f in bin/* install.sh uninstall.sh; do
            [ -f "$f" ] || continue
            if head -1 "$f" | grep -q bash; then files="$files $f"; fi
          done
          # The tree is clean at warning level. Intentional word splitting
          # carries an inline `shellcheck disable=SC2046` with its reason, so a
          # new warning here means new code, not legacy noise.
          # shellcheck disable=SC2086
          shellcheck -S warning $files

      - name: ShellCheck style, SC2xxx info level (informational)
        continue-on-error: true
        run: |
          files=""
          for f in bin/* install.sh uninstall.sh; do
            [ -f "$f" ] || continue
            if head -1 "$f" | grep -q bash; then files="$files $f"; fi
          done
          shellcheck -S style $files || true

  python:
    name: ruff + compile (python tools)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Compile check
        run: |
          for f in bin/*; do
            [ -f "$f" ] || continue
            if head -1 "$f" | grep -q python; then python3 -B -m py_compile "$f"; fi
          done

      - name: Install ruff
        run: pip install ruff

      - name: Ruff (full default ruleset is fatal)
        run: |
          files=""
          for f in bin/*; do
            [ -f "$f" ] || continue
            if head -1 "$f" | grep -q python; then files="$files $f"; fi
          done
          [ -n "$files" ] || { echo "no python tools found"; exit 0; }
          # Clean under the full default ruleset. --isolated so a stray config
          # cannot quietly change what this gate means.
          ruff check --isolated --no-cache $files

      - name: Ruff style (informational)
        continue-on-error: true
        run: |
          files=""
          for f in bin/*; do
            [ -f "$f" ] || continue
            if head -1 "$f" | grep -q python; then files="$files $f"; fi
          done
          ruff check --isolated --no-cache --output-format=concise $files || true

  license:
    name: license headers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Every tool carries an SPDX MIT header
        run: |
          missing=0
          for f in bin/* install.sh uninstall.sh; do
            [ -f "$f" ] || continue
            if ! grep -q 'SPDX-License-Identifier: MIT' "$f"; then
              echo "MISSING LICENSE: $f"
              missing=1
            fi
          done
          if [ "$missing" -eq 0 ]; then echo "all tools licensed"; fi
          exit "$missing"
